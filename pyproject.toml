[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssbench"
version = "0.1.0"
description = "A reproducible benchmark for secret-scanning tools: seeded synthetic corpus, deterministic git history, and precision/recall scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Secrets in the Software Supply Chain" }]
keywords = ["secret-scanning", "benchmark", "security", "gitleaks", "trufflehog", "detect-secrets"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ssbench = "ssbench.cli:app"

[tool.setuptools]
packages = ["ssbench", "ssbench.formats", "ssbench.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
