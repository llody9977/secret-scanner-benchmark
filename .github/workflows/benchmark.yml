name: benchmark

# Builds the synthetic corpus, runs six selected free/self-hostable scanners
# against it in an isolated job each, and scores the results against
# corpus/manifest.yaml. The six are a selection, not an exhaustive field --
# adding a seventh is a matrix entry and a parser, see README.md.
#
# Covered: gitleaks, betterleaks, trufflehog, kingfisher, titus, detect-secrets.
# Not covered: git-secrets (no structured output) and GitHub secret scanning
# (a platform feature, not a CLI — but note that its push protection already
# fires on this corpus; see SECURITY.md).
#
# Design constraints (from the article, section four):
#   * one job per tool so a single failure does not mask the rest (fail-fast: false)
#   * fetch-depth: 0 so history-capable tools actually see history
#   * verification-capable tools: run unfiltered (every synthetic secret is
#     non-live, so a verified-only pass would score ~0% — TruffleHog runs both
#     to demonstrate exactly that trap)
#   * SARIF/JSON per tool uploaded as an artifact, then scored by scoring/score.py
#   * every action and tool pinned to an exact version, recorded in the output
#   * no repository secret is ever injected — the corpus is the only input
#
# Actions are pinned to exact release tags on their Node 24 runtime (checkout v5,
# setup-python v6, upload-artifact v6, download-artifact v7) for readability; for
# production use, repin each to its 40-char commit SHA.

on:
  workflow_dispatch:
  push:
    paths:
      - "ssbench/**"
      - "generator/**"
      - "scoring/**"
      - "corpus/seed"
      - ".github/workflows/benchmark.yml"
  schedule:
    # Rulesets drift; re-run monthly so a stale result is obvious.
    - cron: "0 6 1 * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  GITLEAKS_VERSION: "8.30.1"
  BETTERLEAKS_VERSION: "1.8.1"
  TRUFFLEHOG_VERSION: "3.97.1"
  KINGFISHER_VERSION: "2.0.0"
  TITUS_VERSION: "1.2.8"
  DETECT_SECRETS_VERSION: "1.5.0"
  # Pinning a version tag still trusts whatever that tag points at today, so every
  # archive is checked against its digest before it is executed. Chapter three
  # says to do this; the benchmark did not, which is the sort of gap the
  # regression suite exists to catch and this workflow had no equivalent of.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
  TRUFFLEHOG_SHA256: "f863ea3a8d786f7d097870496c977944cce7372a2fe1e56707d965016e543ece"
  KINGFISHER_SHA256: "d30d71f82e25e8c024f98cce3258c90e17b5be31d0fdb6f30b438d2fac1f130b"
  TITUS_SHA256: "435f2b37e5532d850ddedc32dd366cc213af5f32b1336a2a0d8be34a6dea4c50"

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ssbench
        run: pip install -e .
      - name: Generate corpus
        run: |
          SEED="$(cat corpus/seed)"
          echo "seed=$SEED" >> "$GITHUB_STEP_SUMMARY"
          python generator/generate.py --seed "$SEED" --output ./bench
      - name: Fail if the committed manifest is stale
        run: |
          RECORDED="$(python -c "import yaml,sys; print(yaml.safe_load(open('corpus/manifest.yaml'))['corpus_head_commit'])")"
          FRESH="$(python -c "import yaml,sys; print(yaml.safe_load(open('bench/manifest.yaml'))['corpus_head_commit'])")"
          echo "recorded=$RECORDED fresh=$FRESH"
          test "$RECORDED" = "$FRESH" || {
            echo "::error::corpus/manifest.yaml is out of date — regenerate with: python generator/generate.py --seed \$(cat corpus/seed) --output ./bench --record"
            exit 1
          }
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: corpus
          path: bench/
          include-hidden-files: true
          retention-days: 7

  scan:
    needs: generate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool: [gitleaks, betterleaks, trufflehog, kingfisher, titus, detect-secrets]
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/download-artifact@v7.0.0
        with:
          name: corpus
          path: bench
      - name: Prepare scan target
        run: |
          mkdir -p scan-output
          # The ground-truth manifest ships in the corpus artifact for the score
          # job, but it is not part of the repository under test — it holds every
          # planted value in plaintext. Leaving it in the tree lets all-files
          # scanners (detect-secrets, kingfisher, titus) rack up matches on it.
          rm -f bench/manifest.yaml

      # --- gitleaks: regex + entropy, walks history, no verification ----------
      - name: gitleaks
        if: matrix.tool == 'gitleaks'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version | tee scan-output/gitleaks.version
          gitleaks git ./bench --report-format json --report-path scan-output/gitleaks.json --no-banner --exit-code 0
          jq -e 'type == "array"' scan-output/gitleaks.json > /dev/null
      - name: betterleaks
        if: matrix.tool == 'betterleaks'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$BETTERLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install "$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name betterleaks | head -1)" /usr/local/bin/betterleaks
          betterleaks version | tee scan-output/betterleaks.version
          # No --validation: synthetic secrets are non-live. 'git' walks full history.
          betterleaks git ./bench --report-path scan-output/betterleaks.sarif --report-format sarif --exit-code 0
          jq -e '.runs[0].results | type == "array"' scan-output/betterleaks.sarif > /dev/null
      - name: trufflehog
        if: matrix.tool == 'trufflehog'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /usr/local/bin trufflehog
          trufflehog --version 2>&1 | tee scan-output/trufflehog.version
          # Run 1: every result. The only correct mode against a non-live corpus.
          trufflehog git file://./bench --json --no-update --results=verified,unknown,unverified \
            > scan-output/trufflehog-all.json
          # Run 2: verified only. Expected to be empty, and reported to show the trap.
          trufflehog git file://./bench --json --no-update --only-verified \
            > scan-output/trufflehog-verified.json
          # JSON Lines: every non-blank line must parse as an object.
          jq -e -s 'all(.[]; type == "object")' scan-output/trufflehog-all.json > /dev/null
      - name: kingfisher
        if: matrix.tool == 'kingfisher'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kingfisher.tgz"
          curl --proto '=https' --tlsv1.2 -sSLf "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/kingfisher-linux-x64.tgz" -o "$archive"
          printf '%s  %s\n' "$KINGFISHER_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install "$(find "$RUNNER_TEMP" -maxdepth 2 -type f -name kingfisher | head -1)" /usr/local/bin/kingfisher
          kingfisher --version | tee scan-output/kingfisher.version
          # Walks history by default; --validation-filter all keeps every finding.
          # Kingfisher exits 200 when it finds something, which is a result and
          # not an error. Anything else is a failure and must not be swallowed:
          # the previous "|| true" hid the fact that nobody knew this code.
          set +e
          kingfisher scan ./bench --format sarif --output scan-output/kingfisher.sarif \
            --validation-filter all --confidence low
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 200 ]; then
            echo "::error::kingfisher exited $status"; exit "$status"
          fi
          jq -e '.runs[0].results | type == "array"' scan-output/kingfisher.sarif > /dev/null
      - name: titus
        if: matrix.tool == 'titus'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSLf "https://github.com/praetorian-inc/titus/releases/download/v${TITUS_VERSION}/titus-linux-amd64" -o "$RUNNER_TEMP/titus"
          printf '%s  %s\n' "$TITUS_SHA256" "$RUNNER_TEMP/titus" | sha256sum --check --strict
          sudo install "$RUNNER_TEMP/titus" /usr/local/bin/titus
          titus version | tee scan-output/titus.version
          # scan populates a datastore (--git walks history); report renders SARIF.
          titus scan ./bench --git --ruleset all --output titus.ds
          titus report --datastore titus.ds --format sarif > scan-output/titus.sarif
          jq -e '.runs[0].results | type == "array"' scan-output/titus.sarif > /dev/null
      - name: detect-secrets
        if: matrix.tool == 'detect-secrets'
        run: |
          set -euo pipefail
          pip install "detect-secrets==${DETECT_SECRETS_VERSION}"
          detect-secrets --version | tee scan-output/detect-secrets.version
          # Scans the checked-out tree, not history, by design.
          ( cd bench && detect-secrets scan --all-files ) > scan-output/detect-secrets.json
          jq -e '.results | type == "object"' scan-output/detect-secrets.json > /dev/null
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: scan-${{ matrix.tool }}
          path: scan-output/
          retention-days: 7

  score:
    needs: scan
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e .
      - uses: actions/download-artifact@v7.0.0
        with:
          name: corpus
          path: bench
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: scan-*
          merge-multiple: true
          path: scan-output
      - name: Build the run index
        run: |
          python - <<'PY'
          import pathlib, yaml
          out = pathlib.Path("scan-output")

          def version(name: str) -> str:
              f = out / f"{name}.version"
              return f.read_text().strip().splitlines()[-1] if f.exists() else "unknown"

          FULL = ["working-tree", "history", "verification"]
          runs = []

          def add(report, **kw):
              if (out / report).exists():
                  runs.append(dict(path=report, **kw))

          add("gitleaks.json", tool="gitleaks", version=version("gitleaks"), parser="gitleaks",
              mode="default", capabilities=["working-tree", "history"])
          add("betterleaks.sarif", tool="betterleaks", version=version("betterleaks"), parser="sarif",
              mode="default", capabilities=FULL)
          add("trufflehog-all.json", tool="trufflehog", version=version("trufflehog"), parser="trufflehog",
              mode="all-results", capabilities=FULL)
          add("trufflehog-verified.json", tool="trufflehog", version=version("trufflehog"), parser="trufflehog",
              mode="verified-only", capabilities=FULL, counts_toward_coverage=False)
          add("kingfisher.sarif", tool="kingfisher", version=version("kingfisher"), parser="sarif",
              mode="default", capabilities=FULL)
          add("titus.sarif", tool="titus", version=version("titus"), parser="sarif",
              mode="default", capabilities=FULL)
          add("detect-secrets.json", tool="detect-secrets", version=version("detect-secrets"),
              parser="detect-secrets", mode="default", capabilities=["working-tree"])

          (out / "index.yaml").write_text(yaml.safe_dump({"runs": runs}, sort_keys=False))
          print(yaml.safe_dump({"runs": runs}, sort_keys=False))
          PY
      - name: Score
        run: |
          python scoring/score.py --manifest ./bench/manifest.yaml --results ./scan-output --out ./results
          {
            echo "## Benchmark results"
            echo
            cat results/results.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: results
          path: results/
          retention-days: 30
